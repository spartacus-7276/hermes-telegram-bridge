<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Golden Ratio film</title>
<!-- DM Sans + Noto Sans Devanagari, downloaded from Google Fonts into fonts/ so the render never depends on the network -->
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage {
    position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #FFFFFF;
    font-family: 'DM Sans', 'Noto Sans Devanagari', sans-serif; color: #16181D;
    -webkit-font-smoothing: antialiased; font-variant-numeric: tabular-nums;
  }
  #stage div, #measure div { box-sizing: border-box; }
  .a { position: absolute; }
  .deva { font-family: 'Noto Sans Devanagari', 'DM Sans', sans-serif; }
  #measure { position: absolute; left: -6000px; top: 0; visibility: hidden;
    font-family: 'DM Sans', 'Noto Sans Devanagari', sans-serif; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="measure"></div>
<script>
'use strict';

/* =====================================================================
   SETTINGS — the only invented details are the project, price, buyer and
   sales person below. Every number on screen comes from the brief.
   ===================================================================== */
const SHOW_SHEET  = true;                         // S6 on/off. Off = film runs 84 s, all later cuts shift by 180 frames.
const SHEET_TITLE = 'Leads — Skyline Residency';  // change the destination here without touching the rest
const PROJECT = 'Skyline Residency';
const PRICE   = '₹72L';
const PHONE   = '98xxx 41208';
const BUYER   = 'Rahul P.';
const SALES   = 'Sneha';

const C = {
  page: '#FFFFFF', panel: '#F6F7F9', dark: '#16181D', ink: '#16181D', grey: '#6B7280', hair: '#E6E8EC',
  green: '#12A471', coral: '#F4573B', blue: '#3E7BFA', gold: '#C98A2B',
  // drawing tones borrowed from the illustrated pitch deck
  slate: '#2B3240', skin: '#F3C9A6', mouth: '#C99A72', mute: '#CFD5DC', mute2: '#9AA1AC',
  greenTint: '#E3F5EC', darkPanel: '#1E2127', darkLine: '#2E323A',
};
const AMBER = '#E0A526'; // "visit done" edge, named in the brief

/* 9:16 cut: the same film, re-laid out for 1080 × 1920. Each shot is drawn in 16:9 design coordinates and
   framed by a per-shot camera; a few layouts (chat, dashboard, calling) move their parts for the tall frame. */
const QS = new URLSearchParams(location.search);
const VERT = QS.get('v') === '1';
const SW = VERT ? 1080 : 1920, SHH = VERT ? 1920 : 1080;
const VCAM = {
  S1: { s: 1.35, cx: 960, cy: 500 }, S2: { s: 1.08, cx: 960, cy: 569 }, S3: { s: 1.08, cx: 960, cy: 852 },
  S4: { s: 1.25, cx: 960, cy: 558 }, S5: { s: 1.08, cx: 960, cy: 742 }, S6: { s: .95, cx: 960, cy: 552 },
  S7: { s: .95, cx: 960, cy: 552 }, S8: { s: 1.15, cx: 960, cy: 700 }, S9: { s: .7, cx: 960, cy: 540 },
};
const CAMC = n => VERT ? { x: VCAM[n].cx, y: VCAM[n].cy } : { x: 960, y: 540 }; // the point that lands at frame centre
const FULLBG = (c, extra = '') => `<div class="a" style="left:-2000px;top:-2000px;width:5920px;height:5080px;background:${c};${extra}"></div>`;

/* ============================ motion core ============================ */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const E = {
  lin: t => t,
  out: t => 1 - Math.pow(1 - t, 3),
  out5: t => 1 - Math.pow(1 - t, 5),
  in: t => t * t * t,
  in2: t => t * t,
  io: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  sio: t => -(Math.cos(Math.PI * t) - 1) / 2,
};
function outBack(s) { return t => { const u = t - 1; return 1 + (s + 1) * u * u * u + s * u * u; }; }
function backFor(peak) { // overshoot curve whose peak is exactly `peak` past the target
  let lo = 0, hi = 6;
  for (let i = 0; i < 50; i++) {
    const s = (lo + hi) / 2, f = outBack(s); let m = 0;
    for (let k = 0; k <= 400; k++) m = Math.max(m, f(k / 400));
    if (m - 1 > peak) hi = s; else lo = s;
  }
  return outBack((lo + hi) / 2);
}
E.pop6 = backFor(0.06); E.back = backFor(0.12); E.back4 = backFor(0.04);

// keyframe table: [[frame, value, easeIntoNext?], ...]
function kf(f, keys, ease = E.io) {
  if (f <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) {
    const a = keys[i], b = keys[i + 1];
    if (f <= b[0]) return lerp(a[1], b[1], (a[2] || ease)((f - a[0]) / (b[0] - a[0])));
  }
  return keys[keys.length - 1][1];
}
const P = (f, a, b, e = E.lin) => e(clamp((f - a) / (b - a)));
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }; // seeded, no Math.random
const mixHex = (a, b, t) => {
  const pa = [1, 3, 5].map(i => parseInt(a.slice(i, i + 2), 16)), pb = [1, 3, 5].map(i => parseInt(b.slice(i, i + 2), 16));
  return '#' + pa.map((v, i) => Math.round(lerp(v, pb[i], clamp(t))).toString(16).padStart(2, '0')).join('');
};
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

/* blur: round blur via CSS, directional smear via SVG feGaussianBlur with separate x/y */
let DEFS = [], FID = 0;
function dbl(sx, sy) {
  sx = Math.abs(sx); sy = Math.abs(sy);
  if (sx < 0.25 && sy < 0.25) return '';
  const id = 'f' + (FID++);
  DEFS.push(`<filter id="${id}" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="${sx.toFixed(2)} ${sy.toFixed(2)}"/></filter>`);
  return `url(#${id})`;
}
const rbl = r => r < 0.2 ? '' : `blur(${r.toFixed(2)}px)`;
const F = (...p) => { p = p.filter(Boolean); return p.length ? `filter:${p.join(' ')};` : ''; };
const mb = (vx, vy, k = 0.4, cap = 26) => dbl(Math.min(cap, Math.abs(vx) * k), Math.min(cap, Math.abs(vy) * k));
const vel = (fn, f) => fn(f) - fn(f - 1);
const cmb = (vx, vy) => mb(vx, vy, .12, 3); // small, capped smear for the cursor and thumbs so they never read as a smudge
const A = (st, inner = '') => `<div class="a" style="${st}">${inner}</div>`;

/* ============================ shared assets ============================ */
function headG(cx, cy, r, hair = 'buyer') {
  let h = '';
  if (hair === 'sneha') h += `<circle cx="${cx + r * .6}" cy="${cy - r * .82}" r="${r * .4}" fill="${C.slate}"/>`;
  h += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${C.skin}"/>`;
  if (hair === 'sneha')
    h += `<path d="M${cx - r} ${cy + r * .35} L${cx - r} ${cy - r * .2} A${r} ${r * .95} 0 0 1 ${cx + r} ${cy - r * .2} L${cx + r} ${cy + r * .35} L${cx + r * .78} ${cy - r * .12} L${cx - r * .78} ${cy - r * .12} Z" fill="${C.slate}"/>`;
  else h += `<path d="M${cx - r} ${cy - r * .2} A${r} ${r * .93} 0 0 1 ${cx + r} ${cy - r * .2} Z" fill="${C.slate}"/>`;
  h += `<circle cx="${cx - r * .34}" cy="${cy + r * .16}" r="${r * .1}" fill="${C.slate}"/><circle cx="${cx + r * .34}" cy="${cy + r * .16}" r="${r * .1}" fill="${C.slate}"/>`;
  h += `<path d="M${cx - r * .24} ${cy + r * .46} Q${cx} ${cy + r * .62} ${cx + r * .24} ${cy + r * .46}" stroke="${C.mouth}" stroke-width="${r * .11}" stroke-linecap="round" fill="none"/>`;
  return h;
}
// the buyer — one character, the same everywhere
function buyerSVG(w) {
  return `<svg width="${w}" height="${w * 210 / 120}" viewBox="0 0 120 210" style="display:block">
    <rect x="34" y="150" width="18" height="56" rx="9" fill="${C.slate}"/><rect x="68" y="150" width="18" height="56" rx="9" fill="${C.slate}"/>
    <rect x="22" y="88" width="76" height="80" rx="30" fill="${C.blue}"/>${headG(60, 52, 32)}</svg>`;
}
function avatar(size, who = 'buyer', bg = C.panel) {
  const shirt = who === 'sneha' ? C.slate : C.blue;
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" style="display:block">
    <clipPath id="avc"><circle cx="50" cy="50" r="50"/></clipPath>
    <g clip-path="url(#avc)"><rect width="100" height="100" fill="${bg}"/>
    <rect x="18" y="78" width="64" height="60" rx="28" fill="${shirt}"/>${headG(50, 50, 25, who)}</g></svg>`;
}
function thumb(tipX, tipY, rot = -14, press = 0, extra = '') {
  return A(`left:${tipX - 75}px;top:${tipY - 22}px;width:150px;height:400px;transform-origin:75px 22px;transform:rotate(${rot}deg) translateY(${press * 7}px) scale(${1 - press * .02});${extra}`,
    `<svg width="150" height="400" viewBox="0 0 150 400" style="display:block;overflow:visible">
      <path d="M26 400 L26 100 Q26 20 75 20 Q124 20 124 100 L124 400 Z" fill="${C.skin}" stroke="#E2B48E" stroke-width="2"/>
      <path d="M46 46 Q75 30 104 46 L102 104 Q75 116 48 104 Z" fill="#F9E1CF"/>
      <path d="M40 182 Q75 194 110 182" stroke="#E2AE88" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`);
}
function cursor(x, y, s = 1, extra = '') { // macOS arrow, black fill, white outline, soft shadow; callers cap blur via cmb()
  return A(`left:${x - 3}px;top:${y - 3}px;width:40px;height:56px;transform-origin:3px 3px;transform:scale(${s});${extra}`,
    `<svg width="40" height="56" viewBox="0 0 26 36" style="display:block;overflow:visible;filter:drop-shadow(0 3px 4px rgba(22,24,29,.28))">
      <path d="M2 2 L2 28 L8.4 22 L12.6 31.6 L17 29.6 L12.9 20.3 L21.6 20.3 Z" fill="#16181D" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round"/></svg>`);
}
const ICON = {
  search: (s, c = C.grey) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="display:block"><circle cx="10.5" cy="10.5" r="6.5" stroke="${c}" stroke-width="2.4" fill="none"/><path d="M15.5 15.5 L21 21" stroke="${c}" stroke-width="2.4" stroke-linecap="round"/></svg>`,
  chat: (s, c = '#fff') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="display:block"><path d="M12 3 a9 9 0 0 1 0 18 a9 9 0 0 1 -4.4 -1.15 L3 21 l1.2 -4.4 A9 9 0 0 1 12 3 z" fill="none" stroke="${c}" stroke-width="2.2" stroke-linejoin="round"/><path d="M9 9.2 q0.6 3.6 5.6 5.6" stroke="${c}" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>`,
  phone: (s, c = C.ink) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="display:block"><path d="M6.6 3.5 a2 2 0 0 1 2.5 -.6 l2 3 l-2 2 a10 10 0 0 0 7 7 l2 -2 l3 2 a2 2 0 0 1 -.6 2.5 c-3.5 2.8 -16.7 -10.4 -13.9 -13.9 z" fill="${c}"/></svg>`,
  doc: (s, c = C.ink) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="display:block"><path d="M6 2 h8 l5 5 v13 a2 2 0 0 1 -2 2 H6 a2 2 0 0 1 -2 -2 V4 a2 2 0 0 1 2 -2 z" fill="${c}"/><path d="M14 2 v5 h5" fill="#FFFFFF" opacity=".35"/><rect x="7" y="12" width="10" height="1.8" rx=".9" fill="#fff"/><rect x="7" y="15.6" width="7" height="1.8" rx=".9" fill="#fff"/></svg>`,
  pin: (s, c = C.ink) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="display:block"><path d="M12 2 a7.5 7.5 0 0 1 7.5 7.5 c0 5.6 -7.5 12.5 -7.5 12.5 s-7.5 -6.9 -7.5 -12.5 A7.5 7.5 0 0 1 12 2 z" fill="${c}"/><circle cx="12" cy="9.5" r="2.8" fill="#fff"/></svg>`,
  clock: (s, c = C.ink) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="display:block"><circle cx="12" cy="13" r="8.5" stroke="${c}" stroke-width="2.2" fill="none"/><path d="M12 8.5 V13 l3 2" stroke="${c}" stroke-width="2.2" stroke-linecap="round" fill="none"/><rect x="9.5" y="1.6" width="5" height="2.4" rx="1.2" fill="${c}"/></svg>`,
  person: (s, c = '#fff') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="display:block"><circle cx="12" cy="8" r="4" fill="${c}"/><path d="M4 21 a8 7 0 0 1 16 0 z" fill="${c}"/></svg>`,
  shield: (s, c = C.ink) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="display:block"><path d="M12 2 l8 3 v6 c0 5 -3.5 9 -8 11 c-4.5 -2 -8 -6 -8 -11 V5 z" fill="${c}"/><path d="M8.5 12 l2.5 2.5 l4.5 -5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  cal: (s, c = C.ink) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="display:block"><rect x="3" y="5" width="18" height="16" rx="3" fill="none" stroke="${c}" stroke-width="2.2"/><path d="M3 10 h18" stroke="${c}" stroke-width="2.2"/><rect x="7" y="2" width="2.2" height="5" rx="1.1" fill="${c}"/><rect x="14.8" y="2" width="2.2" height="5" rx="1.1" fill="${c}"/></svg>`,
  back: (s, c = C.ink) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="display:block"><path d="M19 12 H6 M11 6 l-6 6 l6 6" stroke="${c}" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  chev: (s, c = C.grey) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="display:block"><path d="M6 9 l6 6 l6 -6" stroke="${c}" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  grid: (s, c = C.green) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="display:block"><rect x="3" y="3" width="18" height="18" rx="3" fill="${c}"/><path d="M3 9.5 h18 M3 15 h18 M9.5 9.5 v11.5" stroke="#fff" stroke-width="1.6"/></svg>`,
};
// WhatsApp-style double tick (shape used for the S5 → S6 match cut)
const TICK_D = 'M2 11 l6 6 l12 -14 M14 17 l1 -1 l14 -15';
const tick2 = (w, c) => `<svg width="${w}" height="${w * 20 / 34}" viewBox="0 0 34 20" style="display:block;overflow:visible"><path d="${TICK_D}" stroke="${c}" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const bar = (x, y, w, h, c = C.hair, r = null) => A(`left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${r == null ? h / 2 : r}px;background:${c}`);

// flat tower illustration (ad image and the project page hero)
function towerArt(w, h, grey = false) {
  const main = grey ? C.mute : C.ink, side = grey ? '#DCE0E5' : C.grey, back = grey ? '#E6E8EC' : C.hair;
  let win = '';
  for (let r = 0; r < 9; r++) for (let c = 0; c < 4; c++)
    win += `<rect x="${112 + c * 15}" y="${52 + r * 15}" width="8" height="8" rx="1.5" fill="#FFFFFF" opacity="${grey ? .5 : (hash(r * 7 + c) > .62 ? .9 : .22)}"/>`;
  for (let r = 0; r < 6; r++) for (let c = 0; c < 2; c++)
    win += `<rect x="${188 + c * 18}" y="${96 + r * 15}" width="9" height="8" rx="1.5" fill="#FFFFFF" opacity="${grey ? .5 : .3}"/>`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 300 200" preserveAspectRatio="xMidYMax slice" style="display:block">
    <rect width="300" height="200" fill="${grey ? '#EDEFF2' : C.panel}"/>
    <rect x="54" y="112" width="44" height="80" rx="4" fill="${back}"/><rect x="240" y="126" width="34" height="66" rx="4" fill="${back}"/>
    <rect x="102" y="38" width="76" height="154" rx="5" fill="${main}"/>
    <rect x="182" y="84" width="50" height="108" rx="5" fill="${side}"/>${win}
    <circle cx="40" cy="176" r="14" fill="${grey ? '#DCE0E5' : C.mute}"/><circle cx="258" cy="178" r="12" fill="${grey ? '#DCE0E5' : C.mute}"/>
    <rect x="0" y="190" width="300" height="10" fill="${back}"/></svg>`;
}

/* ===================== phone UIs (designed 372 px wide) ===================== */
const D = 2.6;            // full-frame scale for a phone UI ("the screen becomes the frame")
const COLX = 960 - 186 * D;
const QUERY = '2 bhk in wakad ready possession';

function resultCard(i) {
  if (i === 0) return `
    <div class="a" style="left:12px;top:9px;display:flex;align-items:center;gap:6px;white-space:nowrap">
      <span style="font-size:8.5px;font-weight:700;border:1px solid ${C.ink};border-radius:4px;padding:0 4px;line-height:12px">Ad</span>
      <span style="font-size:8.5px;color:${C.grey}">${PROJECT}, Wakad</span></div>
    <div class="a" style="left:12px;top:24px;font-size:12.5px;font-weight:500;color:${C.blue};white-space:nowrap">2 BHK homes in Wakad — ${PROJECT}</div>
    <div class="a" style="left:12px;top:42px;font-size:9px;color:${C.grey};white-space:nowrap">745 sq ft · ${PRICE} all inclusive · Possession Dec 2027</div>`;
  const t = i === 1 ? '2 BHK flats for sale in Wakad, Pune' : 'Ready possession homes near Wakad';
  return `${bar(12, 12, 84, 5)}
    <div class="a" style="left:12px;top:22px;font-size:12.5px;font-weight:500;white-space:nowrap">${t}</div>
    ${bar(12, 43, 250, 5)}${bar(12, 52, 170, 5)}`;
}
const RES_Y = i => 88 + i * 70;
function googleUI(lf, o = {}) {
  const n = lf < 8 ? 0 : clamp(Math.floor((lf - 8) / 2) + 1, 0, QUERY.length);
  const typing = lf >= 8 && n < QUERY.length;
  const caretOn = !o.noCaret && (typing || ((Math.floor(lf / 8) % 2) + 2) % 2 === 0);
  let h = A(`left:14px;top:34px;width:344px;height:40px;border-radius:20px;border:1px solid ${C.hair};background:#fff;box-shadow:0 1px 5px rgba(22,24,29,.07)`,
    A(`left:13px;top:13px`, ICON.search(14)) +
    A(`left:36px;top:0;height:40px;line-height:40px;font-size:14px;white-space:nowrap`,
      `${esc(QUERY.slice(0, n))}<span style="display:inline-block;width:1.3px;height:17px;background:${C.ink};vertical-align:-3px;margin-left:1px;opacity:${caretOn ? 1 : 0}"></span>`));
  for (let i = 0; i < 3; i++) {
    const a = 78 + i * 4, t = P(lf, a, a + 14, E.out);
    if (t <= 0 || (o.skip && o.skip(i))) continue;
    const dy = (1 - t) * 40, v = 40 * (P(lf, a, a + 14, E.out) - P(lf - 1, a, a + 14, E.out));
    const press = i === 0 && o.press ? o.press : 0;
    h += A(`left:14px;top:${RES_Y(i) + dy}px;width:344px;height:62px;border-radius:12px;border:1px solid ${C.hair};background:${press > 0 ? mixHex('#FFFFFF', C.panel, press * 2) : '#fff'};opacity:${clamp(t * 1.6)};transform:scale(${1 - press * .04});${F(mb(0, v, .35))}`, resultCard(i));
  }
  return h;
}

function dullPage() { // the template page he leaves (S3, and the left half of S4)
  let h = A(`left:0;top:0;width:372px;height:44px;background:${C.panel};border-bottom:1px solid ${C.hair}`,
    A(`left:16px;top:14px;font-size:12px;font-weight:500;color:${C.mute2}`, PROJECT) + bar(318, 16, 18, 3, C.mute) + bar(318, 22, 18, 3, C.mute) + bar(318, 28, 18, 3, C.mute));
  h += A(`left:0;top:44px;width:372px;height:180px;overflow:hidden`, towerArt(372, 180, true));
  h += A(`left:16px;top:240px;font-size:18px;font-weight:700;color:${C.mute2}`, PROJECT);
  h += bar(16, 272, 300, 7) + bar(16, 286, 260, 7) + bar(16, 300, 280, 7);
  h += A(`left:16px;top:328px;font-size:11px;font-weight:700;color:${C.mute2};letter-spacing:1px`, 'OVERVIEW');
  for (let i = 0; i < 5; i++) h += bar(16, 350 + i * 14, 340 - hash(i + 3) * 90, 7);
  for (let i = 0; i < 4; i++) h += bar(16 + (i % 2) * 174, 432 + Math.floor(i / 2) * 104, 166, 96, '#EDEFF2', 8);
  h += A(`left:16px;top:648px;font-size:11px;font-weight:700;color:${C.mute2};letter-spacing:1px`, 'ENQUIRE NOW');
  for (let i = 0; i < 3; i++) h += A(`left:16px;top:${670 + i * 44}px;width:340px;height:34px;border:1px solid ${C.hair};border-radius:6px;background:#fff`);
  h += A(`left:16px;top:804px;width:340px;height:38px;border-radius:6px;background:${C.mute};color:#fff;font-size:12px;font-weight:700;text-align:center;line-height:38px`, 'Submit');
  for (let i = 0; i < 3; i++) h += bar(16, 870 + i * 14, 300 - i * 40, 7);
  return h;
}

// the real project page: element k rises 20 px into place, staggered 6 frames
function realPage(lf, o = {}) {
  const el = (k, inner, top, hgt) => {
    const a = (o.start ?? 0) + k * 6, t = o.built ? 1 : P(lf, a, a + 12, E.out);
    if (t <= 0) return '';
    return A(`left:0;top:${top + (1 - t) * 20}px;width:372px;height:${hgt}px;opacity:${clamp(t * 1.4)}`, inner);
  };
  let h = el(0, A(`left:0;top:0;width:372px;height:236px;overflow:hidden`, towerArt(372, 236)) +
    A(`left:16px;top:248px;font-size:20px;font-weight:700;white-space:nowrap`, PROJECT) +

shot('S8', 360, (lf, f) => {

/* ============================ captions ============================ */
// [shot, from, to, text] in local frames; one at a time, lower third, 56 px / 700
const CAPTIONS = [

let CAPS = [];
function captionHTML(f) {
  for (const c of CAPS) {
    if (f < c.a || f > c.b) continue;
    const tin = P(f, c.a, c.a + 10, E.out), tout = P(f, c.b - 10, c.b, E.in);

    return A(`${pos}text-align:center;font-size:56px;font-weight:700;letter-spacing:-1px;color:${c.dark ? '#FFFFFF' : C.ink};opacity:${tin * (1 - tout)};${F(rbl(bl))}`, esc(c.text));
  }
  return '';
}

/* ============================ timeline ============================ */
let TL = [], TOTAL = 0;
function buildTimeline() {
  let f0 = 0; TL = [];
  for (const s of SHOTS) {
    if (s.name === 'S6' && !SHOW_SHEET) continue;
    TL.push({ ...s, f0, f1: f0 + s.len - 1 }); f0 += s.len;
  }
  TOTAL = f0;
  CAPS = CAPTIONS.filter(c => TL.find(s => s.name === c[0])).map(([n, a, b, text]) => {
    const s = TL.find(s => s.name === n);
    return { a: s.f0 + a, b: s.f0 + b, text, dark: n === 'S1' || n === 'S8' };
  });
  // guard: never two captions at once
  for (let i = 1; i < CAPS.length; i++) if (CAPS[i].a <= CAPS[i - 1].b) throw new Error('captions overlap: ' + CAPS[i].text);
}

const stage = document.getElementById('stage');
const SHOT_BG = { S1: C.dark, S8: C.dark };
function shotCam(name, lf) { // vertical framing; cameras blend across each match cut so shapes stay put
  const V = VCAM, B = (a, b, t) => ({ s: lerp(a.s, b.s, t), cx: lerp(a.cx, b.cx, t), cy: lerp(a.cy, b.cy, t) });
  switch (name) {
    case 'S1': return B(V.S1, V.S2, P(lf, 148, 177, E.in2));
    case 'S2': return B(V.S2, V.S3, P(lf, 204, 239, E.in2));
    case 'S3': return B(V.S3, V.S4, P(lf, 222, 239, E.in2));
    case 'S4': return B(V.S4, V.S5, P(lf, 230, 306, E.io));
    case 'S5': return lf < 7 ? B(V.S4, V.S5, P(lf + 300, 230, 306, E.io)) : B(V.S5, V.S6, P(lf, 476, 539, E.io));

async function seek(f) {
  DEFS = []; FID = 0;

  // global frames for the cross-shot match cuts are written against the 90 s cut; offset when S6 is off
  const shift = (!SHOW_SHEET && TL.indexOf(s) >= TL.findIndex(x => x.name === 'S7')) ? 180 : 0;
  const lf = f - s.f0;
  let body = s.render(lf, f + shift);
  if (VERT) {
    const cam = shotCam(s.name, lf);
    body = A(`left:${SW / 2 - cam.cx * cam.s}px;top:${SHH / 2 - cam.cy * cam.s}px;width:1920px;height:1080px;transform-origin:0 0;transform:scale(${cam.s})`, body);
  }
  stage.style.background = SHOT_BG[s.name] || '#FFFFFF';
  stage.innerHTML = `<svg width="0" height="0" style="position:absolute"><defs>${DEFS.join('')}</defs></svg>` + body + captionHTML(f);
  await Promise.all([...stage.querySelectorAll('img')].map(i => i.decode().catch(() => {})));

}

window.READY = (async () => {
